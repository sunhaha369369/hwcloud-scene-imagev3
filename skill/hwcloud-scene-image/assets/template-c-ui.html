<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<!-- v2 模板 · C-1 界面隐喻 · 画布编辑态 -->
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:1760px;height:1120px;overflow:hidden;background:#FFFFFF;}
  body{font-family:"Microsoft YaHei","PingFang SC","Source Han Sans SC",sans-serif;-webkit-font-smoothing:antialiased;}
  .canvas{position:relative;width:1760px;height:1120px;background:#FFFFFF;}

  .shell{position:absolute;left:110px;top:66px;width:1520px;height:968px;border-radius:62px;
    background:#FFFFFF;box-shadow:0 22px 60px rgba(31,71,141,.085),0 4px 14px rgba(31,71,141,.04);}
  .panel{position:absolute;left:140px;top:96px;width:1460px;height:908px;border-radius:50px;
    background:linear-gradient(180deg,#E4F1FF 0%,#E9F4FF 34%,#F2F9FF 74%,#F5FAFF 100%);
    border:1px solid #E2EEFD;}
  .title{position:absolute;left:190px;top:132px;font-size:76px;font-weight:600;color:#191919;letter-spacing:.5px;line-height:1.25;}
  .content{position:absolute;left:180px;top:240px;width:1310px;height:644px;border-radius:40px;
    background:#FFFFFF;border:1px solid #F0F5FB;box-shadow:0 10px 30px rgba(31,71,141,.05);}

  .tile{position:absolute;left:248px;top:286px;width:170px;height:170px;border-radius:44px;
    background:linear-gradient(135deg,#4A9DFC 0%,#5E92F9 45%,#7C6BF5 100%);
    box-shadow:0 18px 40px rgba(74,157,252,.42),0 0 40px 8px rgba(124,107,245,.14);
    display:flex;align-items:center;justify-content:center;}

  .input{position:absolute;left:450px;top:312px;width:850px;height:118px;border-radius:30px;
    background:#FFFFFF;border:3px solid #DCE9F9;box-shadow:0 10px 26px rgba(31,71,141,.08);
    display:flex;align-items:center;padding-left:32px;}
  .input .q{font-size:46px;color:#5A616B;margin-left:20px;white-space:nowrap;}

  .board{position:absolute;left:240px;top:486px;width:1160px;height:352px;border-radius:36px;
    background:#F8FBFF;border:2px solid #DDEBFB;box-shadow:0 8px 24px rgba(31,71,141,.05);}

  .node{position:absolute;width:330px;height:132px;border-radius:34px;background:#FFFFFF;
    border:3px solid #C9DCF2;box-shadow:0 8px 22px rgba(31,71,141,.06);
    display:flex;align-items:center;padding-left:26px;}
  .node .tx{margin-left:20px;font-size:48px;font-weight:500;color:#191919;white-space:nowrap;}

  .node.sel{border:5px solid #4A9DFC;background:#F8FBFF;
    box-shadow:0 0 0 12px rgba(74,157,252,.11),0 18px 40px rgba(74,157,252,.20);}

  .hd{position:absolute;width:20px;height:20px;border-radius:5px;background:#FFFFFF;
    border:3px solid #4A9DFC;box-shadow:0 2px 6px rgba(31,71,141,.14);}

  .bubble{position:absolute;left:605px;top:706px;width:430px;height:112px;border-radius:28px;
    background:#FFFFFF;border:3px solid #4A9DFC;box-shadow:0 16px 36px rgba(74,157,252,.22);
    display:flex;align-items:center;padding-left:26px;}
  .bubble .tx{margin-left:16px;font-size:44px;font-weight:500;color:#4A9DFC;white-space:nowrap;}

  .badge{position:absolute;left:1330px;top:300px;width:322px;height:128px;border-radius:32px;background:#FFFFFF;
    box-shadow:0 20px 48px rgba(31,71,141,.16),0 3px 8px rgba(31,71,141,.06);
    display:flex;align-items:center;padding-left:28px;}
  .badge .tx{margin-left:14px;font-size:44px;font-weight:500;color:#191919;white-space:nowrap;}
</style>
</head>
<body>
<div class="canvas">
  <div class="shell"></div>
  <div class="panel"></div>
  <div class="title">一句话出图</div>
  <div class="content"></div>

  <svg width="1760" height="1120" style="position:absolute;left:0;top:0;z-index:6;">
    <g stroke="#A9C7EC" stroke-width="4" stroke-linecap="round" stroke-dasharray="12 10">
      <path d="M820 658 V704"/>
    </g>
  </svg>

  <div class="board"></div>

  <div class="tile">
    <svg width="84" height="84" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF"
         stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="6" cy="5.6" r="2.5"/><circle cx="18" cy="5.6" r="2.5"/><circle cx="12" cy="18.4" r="2.5"/>
      <path d="M8.5 5.6h7"/><path d="M7.4 7.9l3.4 8"/><path d="M16.6 7.9l-3.4 8"/>
    </svg>
  </div>

  <div class="input">
    <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#4A9DFC"
         stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 6h16"/><path d="M4 12h10"/><path d="M4 18h6"/>
    </svg>
    <div class="q">画一张订单支付的架构图</div>
  </div>

  <!-- 三个节点 -->
  <div class="node" style="left:290px;top:526px;">
    <svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="#4A9DFC"
         stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17"/>
      <path d="M12 3.5a13 13 0 0 1 0 17a13 13 0 0 1 0-17"/>
    </svg>
    <div class="tx">网关</div>
  </div>

  <div class="node sel" style="left:655px;top:526px;">
    <svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="#4A9DFC"
         stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M13.5 2.5 5 13.5h5.5l-1 8 8.5-11h-5.5z"/>
    </svg>
    <div class="tx">订单</div>
  </div>

  <div class="node" style="left:1020px;top:526px;">
    <svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="#4A9DFC"
         stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <ellipse cx="12" cy="6" rx="8" ry="3"/>
      <path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/>
      <path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>
    </svg>
    <div class="tx">数据库</div>
  </div>

  <div class="hd" style="left:645px;top:516px;"></div>
  <div class="hd" style="left:975px;top:516px;"></div>
  <div class="hd" style="left:645px;top:648px;"></div>
  <div class="hd" style="left:975px;top:648px;"></div>

  <div class="bubble">
    <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#4A9DFC"
         stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 20h4L19.2 8.8a2.6 2.6 0 0 0-3.6-3.6L4 16.4z"/>
      <path d="M13.5 6.9 17.1 10.5"/>
    </svg>
    <div class="tx">改成异步调用</div>
  </div>

  <div class="badge">
    <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="#4A9DFC"
         stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
      <path d="M11 3l1.9 4.6L17.5 9.5l-4.6 1.9L11 16l-1.9-4.6L4.5 9.5l4.6-1.9z"/>
      <path d="M18 15l.9 2.1 2.1.9-2.1.9-.9 2.1-.9-2.1-2.1-.9 2.1-.9z"/>
    </svg>
    <div class="tx">局部可改</div>
  </div>

</div>
</body>
</html>
