<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<!--
  v3 模板 · E 圆形流水线（circle pipeline）
  适用：A → B → C 三步、输入→处理→产出、上传→解析→入库、构建→测试→发布

  三个"圆形节点"用渐变箭头串起来 —— v3 的形状语言是圆，不是方。
  白圆只靠柔和阴影立起来、不加描边；中间那个是唯一渐变体，也是视觉主体。

  改图只改四件事：标题、三个 <use>、三个标签、浮标。
  几何：圆 r=135，圆心 y=568，x=395 / 820 / 1245；箭头 155×70，居中于圆间隙。
-->
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:1760px;height:1120px;overflow:hidden;background:#FFFFFF;}
  body{font-family:"Microsoft YaHei","PingFang SC","Source Han Sans SC",sans-serif;-webkit-font-smoothing:antialiased;}
  .canvas{position:relative;width:1760px;height:1120px;background:#FFFFFF;}

  .shell{position:absolute;left:110px;top:66px;width:1520px;height:968px;border-radius:62px;
    background:#FFFFFF;box-shadow:0 22px 60px rgba(31,71,141,.085),0 4px 14px rgba(31,71,141,.04);}
  .panel{position:absolute;left:140px;top:96px;width:1460px;height:908px;border-radius:50px;overflow:hidden;
    background:linear-gradient(180deg,#E4F1FF 0%,#E9F4FF 34%,#F2F9FF 74%,#F5FAFF 100%);
    border:1px solid #E2EEFD;}
  .dots{position:absolute;left:0;top:0;width:1460px;height:908px;
    background-image:radial-gradient(circle at 1px 1px,#C7DDF7 2.2px,transparent 2.4px);
    background-size:48px 48px;opacity:.42;}
  .halo{position:absolute;left:520px;top:268px;width:600px;height:600px;border-radius:50%;
    background:radial-gradient(circle,rgba(112,168,255,.20) 0%,rgba(112,168,255,.05) 52%,rgba(112,168,255,0) 70%);}

  .title{position:absolute;left:190px;top:132px;font-size:76px;font-weight:600;color:#191919;
    letter-spacing:.5px;line-height:1.25;}

  /* ---- 步骤圆：r=135 ---- */
  .step{position:absolute;width:270px;height:270px;border-radius:50%;background:#FFFFFF;
    box-shadow:0 22px 48px rgba(31,71,141,.12),0 4px 12px rgba(31,71,141,.05);
    display:flex;align-items:center;justify-content:center;}
  .step svg{width:132px;height:132px;color:#2E6FCB;stroke-width:1.5;}

  .step.core{background:linear-gradient(135deg,#4A9DFC 0%,#5E92F9 45%,#7C6BF5 100%);
    box-shadow:0 28px 60px rgba(74,157,252,.44),0 0 60px 12px rgba(124,107,245,.16),
      inset 0 3px 0 rgba(255,255,255,.26);}
  .step.core svg{color:#FFFFFF;stroke-width:1.3;}

  .tag{position:absolute;width:270px;text-align:center;font-size:56px;font-weight:600;
    color:#1F3556;letter-spacing:4px;}

  .badge{position:absolute;left:1312px;top:280px;width:320px;height:128px;border-radius:32px;
    background:#FFFFFF;box-shadow:0 20px 48px rgba(31,71,141,.16),0 3px 8px rgba(31,71,141,.06);
    display:flex;align-items:center;padding-left:32px;z-index:6;}
  .badge svg{width:52px;height:52px;color:#4A9DFC;stroke-width:1.8;}
  .badge .tx{margin-left:14px;font-size:44px;font-weight:500;color:#191919;white-space:nowrap;}
</style>
</head>
<body>
<div class="canvas">
  <div class="shell"></div>
  <div class="panel">
    <div class="dots"></div>
    <div class="halo"></div>
  </div>
  <div class="title">三步出片</div>

  <!-- 箭头：平头 + 尖头，140×64，纵向居中在圆心线 y=568，左右各留 7px 缝隙 -->
  <svg width="140" height="64" style="position:absolute;left:537px;top:536px;z-index:1;">
    <defs><linearGradient id="ag1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#AECFF5"/><stop offset="1" stop-color="#6FA5EE"/>
    </linearGradient></defs>
    <path d="M0 8h86l54 24-54 24H0z" fill="url(#ag1)"/>
  </svg>
  <svg width="140" height="64" style="position:absolute;left:962px;top:536px;z-index:1;">
    <defs><linearGradient id="ag2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#AECFF5"/><stop offset="1" stop-color="#6FA5EE"/>
    </linearGradient></defs>
    <path d="M0 8h86l54 24-54 24H0z" fill="url(#ag2)"/>
  </svg>

  <div class="step" style="left:260px;top:433px;"><svg><use href="#i-upload"/></svg></div>
  <div class="step core" style="left:685px;top:433px;"><svg><use href="#i-sparkles"/></svg></div>
  <div class="step" style="left:1110px;top:433px;"><svg><use href="#i-database"/></svg></div>

  <div class="tag" style="left:260px;top:727px;">上传</div>
  <div class="tag" style="left:685px;top:727px;">解析</div>
  <div class="tag" style="left:1110px;top:727px;">入库</div>

  <div class="badge">
    <svg><use href="#i-check"/></svg>
    <span class="tx">全程自动</span>
  </div>
</div>
<!--
  用法：把 assets/icons.svg 里的全部 symbol 内联到页面顶部（本页已由 scripts/iconlib.py --pack 内联，不用手抄），然后
        <svg class="glyph"><use href="#i-check"/></svg>
  网格：24×24。symbol 内**不写 stroke-width**——linecap 与颜色统一在此，
        线宽由使用处控制：显示 56–64px 用 1.9–2.2（视觉 4.5–6px），
        显示 110px 以上用 1.5–1.7，否则太大尺寸会显得笨重。
  上色：图标吃 currentColor，用 CSS color 或父级 stroke 控制
  约束：只用蓝紫色系（200°–250°），不引入第二套视觉语言
-->
<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
<!-- 本文件只用 4 枚图标；由 scripts/iconlib.py --pack 生成，改图标请重跑 --pack -->
<symbol id="i-upload" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
  <path d="M12 16.5V3.5M7.5 8L12 3.5 16.5 8"/>
  <path d="M3.5 16v3A2.5 2.5 0 006 21.5h12a2.5 2.5 0 002.5-2.5v-3"/>
</symbol>
<symbol id="i-sparkles" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
  <path d="M10 2.5c.6 4.6 4.1 8.1 8.7 8.7-4.6.6-8.1 4.1-8.7 8.7-.6-4.6-4.1-8.1-8.7-8.7 4.6-.6 8.1-4.1 8.7-8.7z"/>
  <path d="M18.5 15.5l.9 2.3 2.3.9-2.3.9-.9 2.3-.9-2.3-2.3-.9 2.3-.9.9-2.3z"/>
</symbol>
<symbol id="i-database" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
  <ellipse cx="12" cy="5.5" rx="8" ry="3"/>
  <path d="M4 5.5v13c0 1.7 3.6 3 8 3s8-1.3 8-3v-13"/>
  <path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>
</symbol>
<symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
  <path d="M20 6L9 17l-5-5"/>
</symbol>
</svg>

</body>
</html>
