<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<!-- v2 模板 · C-2 界面隐喻 · 分层选中态 -->
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:1760px;height:1120px;overflow:hidden;background:#FFFFFF;}
  body{font-family:"Microsoft YaHei","PingFang SC","Source Han Sans SC",sans-serif;-webkit-font-smoothing:antialiased;}
  .canvas{position:relative;width:1760px;height:1120px;background:#FFFFFF;}

  .shell{position:absolute;left:110px;top:66px;width:1520px;height:968px;border-radius:62px;
    background:#FFFFFF;box-shadow:0 22px 60px rgba(31,71,141,.085),0 4px 14px rgba(31,71,141,.04);}
  .panel{position:absolute;left:140px;top:96px;width:1460px;height:908px;border-radius:50px;
    background:linear-gradient(180deg,#E4F1FF 0%,#E9F4FF 34%,#F2F9FF 74%,#F5FAFF 100%);
    border:1px solid #E2EEFD;}
  .title{position:absolute;left:190px;top:132px;font-size:76px;font-weight:600;color:#191919;letter-spacing:.5px;line-height:1.25;}
  .content{position:absolute;left:180px;top:240px;width:1310px;height:644px;border-radius:40px;
    background:#FFFFFF;border:1px solid #F0F5FB;box-shadow:0 10px 30px rgba(31,71,141,.05);}

  /* 层条：宽 910 高 152，只放「图标 + 层名」两件东西 */
  .layer{position:absolute;left:250px;width:910px;height:152px;border-radius:36px;
    background:#FFFFFF;border:3px solid #C9DCF2;box-shadow:0 8px 22px rgba(31,71,141,.06);
    display:flex;align-items:center;}
  .layer .ic{width:90px;height:90px;margin-left:34px;border-radius:26px;background:#E3F0FE;
    display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
  .layer .tx{margin-left:30px;font-size:50px;font-weight:500;color:#191919;letter-spacing:2px;}

  .layer.sel{border:5px solid #4A9DFC;background:#F8FBFF;
    box-shadow:0 0 0 12px rgba(74,157,252,.11),0 18px 40px rgba(74,157,252,.20);}
  .layer.sel .ic{background:#D9EAFF;}

  .tile{position:absolute;right:34px;width:104px;height:104px;border-radius:28px;
    background:linear-gradient(135deg,#4A9DFC 0%,#5E92F9 45%,#7C6BF5 100%);
    box-shadow:0 14px 30px rgba(74,157,252,.42);display:flex;align-items:center;justify-content:center;}

  .hd{position:absolute;width:20px;height:20px;border-radius:5px;background:#FFFFFF;
    border:3px solid #4A9DFC;box-shadow:0 2px 6px rgba(31,71,141,.14);}

  .badge{position:absolute;left:1312px;width:320px;height:128px;border-radius:32px;background:#FFFFFF;
    box-shadow:0 20px 48px rgba(31,71,141,.16),0 3px 8px rgba(31,71,141,.06);
    display:flex;align-items:center;padding-left:28px;}
  .badge .tx{margin-left:14px;font-size:44px;font-weight:500;color:#191919;white-space:nowrap;}
</style>
</head>
<body>
<div class="canvas">
  <div class="shell"></div>
  <div class="panel"></div>
  <div class="title">架构局部迭代</div>
  <div class="content"></div>

  <svg width="1760" height="1120" style="position:absolute;left:0;top:0;">
    <g stroke="#A9C7EC" stroke-width="4" stroke-linecap="round" stroke-dasharray="12 10">
      <path d="M705 446 V486"/><path d="M705 638 V678"/>
    </g>
  </svg>

  <div class="layer" style="top:294px;">
    <div class="ic">
      <svg width="54" height="54" viewBox="0 0 24 24" fill="none" stroke="#4A9DFC"
           stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17"/>
        <path d="M12 3.5a13 13 0 0 1 0 17a13 13 0 0 1 0-17"/>
      </svg>
    </div>
    <div class="tx">接入层</div>
  </div>

  <div class="layer sel" style="top:486px;">
    <div class="ic">
      <svg width="54" height="54" viewBox="0 0 24 24" fill="none" stroke="#4A9DFC"
           stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/>
        <rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/>
      </svg>
    </div>
    <div class="tx">服务层</div>
    <div class="tile">
      <svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF"
           stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 20h4L19.2 8.8a2.6 2.6 0 0 0-3.6-3.6L4 16.4z"/>
        <path d="M13.5 6.9 17.1 10.5"/>
      </svg>
    </div>
  </div>

  <div class="layer" style="top:678px;">
    <div class="ic">
      <svg width="54" height="54" viewBox="0 0 24 24" fill="none" stroke="#4A9DFC"
           stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <ellipse cx="12" cy="6" rx="8" ry="3"/>
        <path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/>
        <path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>
      </svg>
    </div>
    <div class="tx">数据层</div>
  </div>

  <div class="hd" style="left:240px;top:476px;"></div>
  <div class="hd" style="left:1150px;top:476px;"></div>
  <div class="hd" style="left:240px;top:628px;"></div>
  <div class="hd" style="left:1150px;top:628px;"></div>

  <div class="badge" style="top:412px;">
    <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="#4A9DFC"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5 3H3v2"/><path d="M21 5V3h-2"/><path d="M3 19v2h2"/><path d="M19 21h2v-2"/>
      <path d="M9 9h6v6H9z"/>
    </svg>
    <div class="tx">仅改此块</div>
  </div>

  <div class="badge" style="top:580px;">
    <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="#4A9DFC"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M11 3l1.9 4.6L17.5 9.5l-4.6 1.9L11 16l-1.9-4.6L4.5 9.5l4.6-1.9z"/>
      <path d="M18 15l.9 2.1 2.1.9-2.1.9-.9 2.1-.9-2.1-2.1-.9 2.1-.9z"/>
    </svg>
    <div class="tx">布局不变</div>
  </div>

</div>
</body>
</html>
