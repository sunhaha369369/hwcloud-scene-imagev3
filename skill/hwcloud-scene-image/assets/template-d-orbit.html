<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<!--
  v3 模板 · D 核心分支（core-branch）
  适用：一个核心能力 → 多类产出 / 多种形态 / 一个中枢服务 N 个场景

  与 v2 的根本区别：**没有整块 content 白卡**。
  图形直接浮在淡蓝面板上，白底只出现在徽章这种小圆点里。
  整图文字只有：标题 + 4 个三字标签 + 1 个浮标 —— 其余全靠图形说话。

  中心不是"图标"，是"三张错位叠放的图页"图形装置 —— 这比放一个星芒更能说明"多图"。
  几何：圆心 (830,600) r=180；徽章 r=80，距圆心 300；
        左右两列 x=470 / 1170，上下两排 y=410 / 710。
        竖总线走 x=610（左）/ 1050（右），绕开标签（左标签右缘 565）。
-->
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:1760px;height:1120px;overflow:hidden;background:#FFFFFF;}
  body{font-family:"Microsoft YaHei","PingFang SC","Source Han Sans SC",sans-serif;-webkit-font-smoothing:antialiased;}
  .canvas{position:relative;width:1760px;height:1120px;background:#FFFFFF;}

  .shell{position:absolute;left:110px;top:66px;width:1520px;height:968px;border-radius:62px;
    background:#FFFFFF;box-shadow:0 22px 60px rgba(31,71,141,.085),0 4px 14px rgba(31,71,141,.04);}
  .panel{position:absolute;left:140px;top:96px;width:1460px;height:908px;border-radius:50px;overflow:hidden;
    background:linear-gradient(180deg,#E4F1FF 0%,#E9F4FF 34%,#F2F9FF 74%,#F5FAFF 100%);
    border:1px solid #E2EEFD;}

  /* 面板内的淡点阵：给图形一个"工程纸"的底，不参与表意，只撑质感 */
  .dots{position:absolute;left:0;top:0;width:1460px;height:908px;
    background-image:radial-gradient(circle at 1px 1px,#C7DDF7 2.2px,transparent 2.4px);
    background-size:48px 48px;opacity:.42;}

  /* 核心后方的柔光，把视线拉向中心 */
  .halo{position:absolute;left:400px;top:170px;width:860px;height:860px;border-radius:50%;
    background:radial-gradient(circle,rgba(112,168,255,.22) 0%,rgba(112,168,255,.06) 52%,rgba(112,168,255,0) 70%);}

  .title{position:absolute;left:190px;top:132px;font-size:76px;font-weight:600;color:#191919;
    letter-spacing:.5px;line-height:1.25;}

  /* ---- 核心：圆心 (830,600) r=180 ---- */
  .core{position:absolute;left:650px;top:420px;width:360px;height:360px;border-radius:50%;
    background:linear-gradient(135deg,#4A9DFC 0%,#5E92F9 45%,#7C6BF5 100%);
    box-shadow:0 28px 62px rgba(74,157,252,.42),0 0 64px 12px rgba(124,107,245,.16),
      inset 0 3px 0 rgba(255,255,255,.26);}
  .core .art{position:absolute;left:0;top:0;width:360px;height:360px;}

  /* ---- 卫星徽章：r=88 ---- */
  .sat{position:absolute;width:176px;height:176px;border-radius:50%;background:#FFFFFF;
    border:3px solid #CFE0F4;box-shadow:0 16px 38px rgba(31,71,141,.12);
    display:flex;align-items:center;justify-content:center;}
  .sat svg{width:108px;height:108px;color:#2E6FCB;stroke-width:2;}

  /* ---- 标签：48px，三字，居中于徽章正下方 24px ---- */
  .tag{position:absolute;width:190px;text-align:center;font-size:48px;font-weight:600;
    color:#1F3556;letter-spacing:3px;}

  /* ---- 破框浮标 ---- */
  .badge{position:absolute;left:1312px;top:300px;width:320px;height:128px;border-radius:32px;
    background:#FFFFFF;box-shadow:0 20px 48px rgba(31,71,141,.16),0 3px 8px rgba(31,71,141,.06);
    display:flex;align-items:center;padding-left:32px;z-index:6;}
  .badge svg{width:52px;height:52px;color:#4A9DFC;stroke-width:1.8;}
  .badge .tx{margin-left:14px;font-size:44px;font-weight:500;color:#191919;white-space:nowrap;}
</style>
</head>
<body>
<div class="canvas">
  <div class="shell"></div>
  <div class="panel">
    <div class="dots"></div>
    <div class="halo"></div>
  </div>
  <div class="title">一句话出图</div>

  <!--
    分支：各走「枢纽 + 独立段」
    圆盘左缘 (650,600) → 横线到枢纽 (610,600) → 上下两条竖线到两排高度
    → 短横接到徽章边缘 (550,·)。竖线 x=610 大于标签右缘 565，不会压字。
  -->
  <svg width="1760" height="1120" style="position:absolute;left:0;top:0;z-index:1;">
    <g stroke="#B7D3F2" stroke-width="5" stroke-linecap="round">
      <path d="M650 600 H610"/>
      <path d="M610 600 V410"/>
      <path d="M610 600 V710"/>
      <path d="M610 410 H558"/>
      <path d="M610 710 H558"/>
      <path d="M1010 600 H1050"/>
      <path d="M1050 600 V410"/>
      <path d="M1050 600 V710"/>
      <path d="M1050 410 H1082"/>
      <path d="M1050 710 H1082"/>
    </g>
    <g fill="#B7D3F2">
      <circle cx="610" cy="600" r="7"/>
      <circle cx="1050" cy="600" r="7"/>
    </g>
  </svg>

  <div class="core">
    <!-- 三张错位叠放的图页：中心的"图形装置"，替代单个图标 -->
    <svg class="art" viewBox="0 0 360 360">
      <g fill="none" stroke="#FFFFFF" stroke-linejoin="round">
        <rect x="96" y="124" width="128" height="150" rx="22" stroke-width="6" opacity=".42"
              transform="rotate(-14 160 199)"/>
        <rect x="112" y="100" width="128" height="150" rx="22" stroke-width="6" opacity=".68"
              transform="rotate(-7 176 175)"/>
        <rect x="128" y="76" width="128" height="150" rx="22" stroke-width="7"/>
        <path d="M150 114h84M150 142h84M150 170h54" stroke-width="7" stroke-linecap="round"/>
      </g>
      <g transform="translate(270 252)">
        <circle r="44" fill="#FFFFFF" opacity=".96"/>
        <path d="M0 -26c.9 13.4 12.6 25.1 26 26-13.4.9-25.1 12.6-26 26-.9-13.4-12.6-25.1-26-26 13.4-.9 25.1-12.6 26-26z"
              transform="translate(-5 -4) scale(.6)" fill="#7C6BF5"/>
      </g>
    </svg>
  </div>

  <!-- 左列：徽章中心 (470,410) / (470,710) -->
  <div class="sat" style="left:382px;top:322px;"><svg><use href="#i-sequence"/></svg></div>
  <div class="sat" style="left:382px;top:622px;"><svg><use href="#i-er"/></svg></div>
  <div class="tag" style="left:375px;top:522px;">时序图</div>
  <div class="tag" style="left:375px;top:822px;">ER 图</div>

  <!-- 右列：徽章中心 (1170,410) / (1170,710) -->
  <div class="sat" style="left:1082px;top:322px;"><svg><use href="#i-state"/></svg></div>
  <div class="sat" style="left:1082px;top:622px;"><svg><use href="#i-topology"/></svg></div>
  <div class="tag" style="left:1075px;top:522px;">状态机</div>
  <div class="tag" style="left:1075px;top:822px;">拓扑图</div>

  <div class="badge">
    <svg><use href="#i-check"/></svg>
    <span class="tx">一键插入</span>
  </div>
</div>
<!--
  用法：把 assets/icons.svg 里的全部 symbol 内联到页面顶部（本页已由 scripts/iconlib.py --pack 内联，不用手抄），然后
        <svg class="glyph"><use href="#i-check"/></svg>
  网格：24×24。symbol 内**不写 stroke-width**——linecap 与颜色统一在此，
        线宽由使用处控制：显示 56–64px 用 1.9–2.2（视觉 4.5–6px），
        显示 110px 以上用 1.5–1.7，否则太大尺寸会显得笨重。
  上色：图标吃 currentColor，用 CSS color 或父级 stroke 控制
  约束：只用蓝紫色系（200°–250°），不引入第二套视觉语言
-->
<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
<!-- 本文件只用 5 枚图标；由 scripts/iconlib.py --pack 生成，改图标请重跑 --pack -->
<symbol id="i-sequence" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
  <rect x="2.5" y="2.5" width="6.2" height="3.8" rx="1.2"/>
  <rect x="15.3" y="2.5" width="6.2" height="3.8" rx="1.2"/>
  <path d="M5.6 6.3v15.2M18.4 6.3v15.2"/>
  <path d="M5.6 10.8h10.2"/>
  <path d="M18.4 15.6H8.2"/>
</symbol>
<symbol id="i-er" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
  <rect x="2.5" y="8.5" width="6" height="7" rx="1.6"/>
  <rect x="15.5" y="8.5" width="6" height="7" rx="1.6"/>
  <path d="M12 8.8l2 3.2-2 3.2-2-3.2 2-3.2z"/>
  <path d="M8.5 12h1.4M14.1 12h1.4"/>
</symbol>
<symbol id="i-state" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
  <rect x="2" y="8.5" width="7.4" height="7" rx="3.5"/>
  <rect x="14.6" y="8.5" width="7.4" height="7" rx="3.5"/>
  <path d="M9.6 12h3.2"/>
  <path d="M11.4 9.9l2.1 2.1-2.1 2.1"/>
</symbol>
<symbol id="i-topology" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
  <circle cx="12" cy="12" r="2.6"/>
  <circle cx="12" cy="4" r="1.8"/>
  <circle cx="12" cy="20" r="1.8"/>
  <circle cx="4" cy="12" r="1.8"/>
  <circle cx="20" cy="12" r="1.8"/>
  <path d="M12 9.4V5.8M12 14.6v3.6M9.4 12H5.8M14.6 12h3.6"/>
</symbol>
<symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
  <path d="M20 6L9 17l-5-5"/>
</symbol>
</svg>

</body>
</html>
